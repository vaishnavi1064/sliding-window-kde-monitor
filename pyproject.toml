[project]
name = "sketch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
# Everything needed to run the test suite, and nothing else. The suite spans the
# feature areas below, so `pytest` alone does not cover it: two modules are
# imported at collection time and abort the whole run if missing.
#
# These are deliberately listed here rather than reached by installing the
# feature extras. `dev,streaming,mcp` would work too, but it drags in
# confluent-kafka, pyarrow, requests, prometheus-client and psycopg[binary] --
# none of which any test touches (mcp_server.store imports psycopg lazily, inside
# the connect method) -- which defeats the "stay light" intent below.
dev = [
    "pytest",
    "pandas",   # tests/test_evaluation.py, tests/test_mcp_server.py, evaluation/*
    "mcp",      # tests/test_mcp_server.py -> mcp_server.server imports it at module scope
]
# All optional: the sketch itself needs only numpy, so CI and the core package
# stay light. Install what a given task needs.
#
# Evaluation and reporting: figures plus experiment tracking.
analysis = [
    "matplotlib",        # evaluation figures
    "mlflow",            # parameter sweeps vs accuracy/memory
]
# The MCP server and its Postgres-backed alert history.
mcp = [
    "mcp",               # Model Context Protocol server
    "psycopg[binary]",   # Postgres driver for alert history
]
streaming = [
    "confluent-kafka",   # Kafka client for the replay topic
    "prometheus-client", # /metrics endpoint scraped by Prometheus
    "pandas",            # MetroPT CSV/Parquet handling
    "pyarrow",           # Parquet: replaying 1.5M rows from CSV every run is wasteful
    "requests",          # dataset download
]

[build-system]
# pybind11 builds the optional C++17 core (Phase 5). It is a build-time
# requirement only -- the extension is declared `optional`, so a machine with no
# compiler still installs a working pure-Python package. See setup.py.
requires = ["setuptools>=68", "pybind11>=2.13"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sketch*", "streaming*", "evaluation*", "mcp_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
