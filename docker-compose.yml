name: swakde-monitor

services:
  # KRaft mode: no Zookeeper. Single broker is plenty for a single-asset 0.1 Hz feed.
  kafka:
    image: apache/kafka:3.9.0
    container_name: swakde-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Bind with an empty host rather than 0.0.0.0: the broker derives an
      # advertised address for any listener not named in ADVERTISED_LISTENERS,
      # and it rejects 0.0.0.0 there as non-routable.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:9094
      # PLAINTEXT is how the host reaches Kafka; INTERNAL is how sibling
      # containers do.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: swakde-monitor-cluster
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  consumer:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: swakde-consumer
    command: python -m streaming.consumer --bootstrap kafka:9094
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP: kafka:9094
      SKETCH_ROWS: "400"
      SKETCH_K: "3"
      SKETCH_WINDOW: "3600"
      SKETCH_WARMUP: "2000"
    depends_on:
      kafka:
        condition: service_healthy

  producer:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: swakde-producer
    command: python -m streaming.producer --bootstrap kafka:9094
    environment:
      KAFKA_BOOTSTRAP: kafka:9094
      REPLAY_SPEEDUP: "2000"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      kafka:
        condition: service_healthy
    profiles: ["replay"]

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: swakde-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: swakde-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    image: grafana/grafana:11.5.1
    container_name: swakde-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env (see .env.example)}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # Alert history and asset metadata for the MCP server. Populated by
  # scripts/load_alerts.py (make alerts), which writes one row per detected
  # alert episode along with whether it coincided with a documented failure.
  postgres:
    image: postgres:17-alpine
    container_name: swakde-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swakde}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-swakde}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swakde}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
