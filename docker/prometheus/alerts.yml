groups:
  - name: swakde-anomaly
    rules:
      # The Phase 2 alert. Density collapsing relative to its own recent
      # baseline means recent readings have moved into a region the sketch has
      # not seen much of lately -- an emerging fault or a regime change.
      #
      # `for` suppresses single-sample spikes. 30s is tuned for accelerated
      # replay: the score stays elevated for roughly `window_size` readings
      # after a shift (once the new regime fills the sliding window it becomes
      # the new normal), so the usable `for` scales with replay speed. At a real
      # 0.1 Hz feed with a 3600-reading window that span is ~10 hours, and minutes
      # would be the right setting.
      # keep_firing_for stops the alert flapping. The underlying signal really
      # is intermittent: as the injected regime refills the sliding window,
      # density partially recovers and the score oscillates across the
      # threshold, so without this the alert cycles firing -> resolved ->
      # pending several times through a single continuous fault. Holding it for
      # two minutes past the last breach reports one episode instead of five.
      - alert: SensorDensityAnomaly
        expr: swakde_anomaly_score > 1.3
        for: 30s
        keep_firing_for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Sensor density anomaly on {{ $labels.asset }}"
          description: >-
            Smoothed log-density is {{ printf "%.2f" $value }} robust sigmas below
            its rolling median: current readings sit in a region of the feature
            space that has gone sparse within the sliding window. Normal
            operation measured below 0.70 on this asset.

      - alert: SensorDensityAnomalySevere
        expr: swakde_anomaly_score > 2.0
        for: 30s
        keep_firing_for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Severe sensor density anomaly on {{ $labels.asset }}"
          description: >-
            Smoothed log-density is {{ printf "%.2f" $value }} robust sigmas below
            its rolling median.

  - name: swakde-data-quality
    rules:
      - alert: DataQualityDegraded
        expr: rate(swakde_quality_issues_total[1m]) > 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Data quality issues on {{ $labels.asset }} ({{ $labels.kind }})"
          description: >-
            {{ printf "%.2f" $value }} {{ $labels.kind }} issues/s over the last minute.

      - alert: StreamStalled
        expr: rate(swakde_records_total[2m]) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Sensor stream has stalled"
          description: No records consumed for two minutes.
