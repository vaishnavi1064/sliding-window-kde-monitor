global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: swakde-consumer
    static_configs:
      - targets: ["consumer:8000"]
        labels:
          asset: metropt-apu
